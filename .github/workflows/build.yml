name: Build

# Every push builds all packages as workflow artifacts.
# Pushing a tag like v1.2.3 also publishes them as a GitHub release.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    # The Ubuntu runner has the Android SDK preinstalled and sets ANDROID_HOME,
    # so settings.gradle.kts includes the :android module.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          args=()
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then args+=("-PappVersion=${GITHUB_REF_NAME#v}"); fi
          ./gradlew "${args[@]}" :protocol:test :android:assembleDebug
          mkdir out && cp android/build/outputs/apk/debug/*.apk out/hnd-earcam-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: hnd-earcam-android
          path: out/*
          if-no-files-found: error

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            task: packageDeb
            name: hnd-earcam-linux-deb
            file: hnd-earcam-linux-amd64.deb
            pattern: deb/*.deb
          - os: windows-latest
            task: packageMsi
            name: hnd-earcam-windows-msi
            file: hnd-earcam-windows-x64.msi
            pattern: msi/*.msi
          - os: macos-latest
            task: packageDmg
            name: hnd-earcam-macos-dmg
            file: hnd-earcam-macos-arm64.dmg
            pattern: dmg/*.dmg
    runs-on: ${{ matrix.os }}
    # The runners have an Android SDK. Hide it so the desktop build skips :android.
    env:
      ANDROID_HOME: ""
      ANDROID_SDK_ROOT: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        shell: bash
        run: |
          args=()
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then args+=("-PappVersion=${GITHUB_REF_NAME#v}"); fi
          ./gradlew "${args[@]}" :desktop:${{ matrix.task }}
          mkdir out && cp desktop/build/compose/binaries/main/${{ matrix.pattern }} out/${{ matrix.file }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "HND earcam ${GITHUB_REF_NAME#v}" --generate-notes

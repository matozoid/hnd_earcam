name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    # The Ubuntu runner has the Android SDK preinstalled and sets ANDROID_HOME,
    # so settings.gradle.kts includes the :android module.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :protocol:test :android:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: earcam-android
          path: android/build/outputs/apk/debug/*.apk

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            task: packageDeb
            name: earcam-linux-deb
          - os: windows-latest
            task: packageMsi
            name: earcam-windows-msi
          - os: macos-latest
            task: packageDmg
            name: earcam-macos-dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :desktop:${{ matrix.task }}
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            desktop/build/compose/binaries/main/deb/*.deb
            desktop/build/compose/binaries/main/msi/*.msi
            desktop/build/compose/binaries/main/dmg/*.dmg
          if-no-files-found: error
